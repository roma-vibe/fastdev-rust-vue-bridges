дит для продуктов, которые начинаются как модульный монолит и со временем могут вырасти в микросервисы, с безопасностью по умолчанию (заголовки безопасности и CSP на edge, защищённый от SSRF клиент для исходящих запросов, данные с владельцем; с аккаунтами — проверка Origin против CSRF и замедление входа) и проверкой качества без предупреждений (clippy, rustfmt, ESLint, Prettier, vue-tsc, cargo test, Vitest, secbase)."
