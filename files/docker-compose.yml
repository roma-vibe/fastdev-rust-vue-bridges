# Production container: every service and the web app; the edge serves both on EDGE_PORT. By default
# one process (app-all); BRIDGES=off / SEPARATE_SERVICES in .env run separate services (docs/bridges.md).
# Values come from .env (Compose reads it for ${...} and passes it to the app with env_file).
services:
  app:
    build:
      context: .
      args:
        APP_NAME: ${APP_NAME:?Set APP_NAME in .env}
    image: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .env}-app
    env_file: .env
    environment:
      APP_ROOT: /app
      BIND_HOST: 0.0.0.0
      DB_PATH: /app/data/app.sqlite
      WEB_DIST: /app/web/dist
      # The public address from .env (its origin may send cookie-signed writes), else the edge.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${EDGE_PORT:-8700}}
    ports:
      # Only the edge is published, on the host's loopback only; with separate services the others
      # stay inside the container.
      - '127.0.0.1:${EDGE_PORT:-8700}:${EDGE_PORT:-8700}'
    volumes:
      # DOCKER_DATA: `data` (named volume) or `./data` (the project folder).
      - ${DOCKER_DATA:-data}:/app/data
    # The app lets in-flight requests finish for up to 10 s after SIGTERM.
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  data:
